[project]
name = "mtg-deck-builder-backend"
version = "0.1.0"
description = "FastAPI backend for an MCP, RAG, and skill-based MTG deck building agent."
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai-agents",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
agent = [
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
